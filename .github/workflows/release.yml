name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            arch: x64
            asset: ImageDeduper-Windows-x64-Setup.exe
          - name: macOS Apple Silicon
            os: macos-15
            arch: arm64
            asset: ImageDeduper-macOS-arm64.zip
          - name: macOS Intel
            os: macos-15-intel
            arch: x64
            asset: ImageDeduper-macOS-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run make -- --arch ${{ matrix.arch }}
      - name: Prepare Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          $installer = Get-ChildItem dist-artifacts/make -Recurse -Filter *.exe | Select-Object -First 1
          Copy-Item -LiteralPath $installer.FullName -Destination "release/${{ matrix.asset }}"
      - name: Prepare macOS asset
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir release
          archive="$(find dist-artifacts/make -type f -name '*.zip' | head -n 1)"
          cp "$archive" "release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Package Node.js CLI
        run: |
          npm pack --pack-destination release-assets
          mv release-assets/image-deduper-*.tgz release-assets/ImageDeduper-Node-CLI.tgz
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --title "Image Deduper $GITHUB_REF_NAME"
          --generate-notes
